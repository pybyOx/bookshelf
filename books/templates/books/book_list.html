{% extends "books/base.html" %}

{% block title %}Список книг{% endblock title %}

{% block content %}
    <ul>
        {% for book in books %}
            <li>{{ book.title }} - {{ book.author }} ({{ book.year }})</li>
        {% empty %}
            <p>Нет книг</p>
        {% endfor %}
    </ul>
{% endblock content %}
